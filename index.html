<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Новый год вместе с Росинкой</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #d32f2f; }
    .story-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
    .story-card img { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; float: left; margin-right: 15px; }
    .story-card h3 { margin-top: 0; }
  </style>
</head>
<body>
  <h1>Новый год вместе с Росинкой 🎄</h1>
  <p>Истории наших друзей и любимые новогодние традиции.</p>
  <div id="stories"></div>

  <script>
    fetch('data/tree.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('stories');
        data.forEach(item => {
          const card = document.createElement('div');
          card.className = 'story-card';
          card.innerHTML = `
            <img src="${item.photo}" alt="${item.name}" />
            <h3>\${item.name}</h3>
            <p>\${item.story}</p>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => console.error('Ошибка загрузки данных:', err));
  </script>
</body>
</html>
